[project]
name = "prog-strength-tooling"
version = "0.4.0"
description = "Personal Typer CLI for probing queries and maintenance tasks against the prog-strength stack."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jimmy Wallace" }]

dependencies = [
    # CLI framework — subcommand groups, flag parsing, help.
    "typer>=0.12",
    # HTTP client for the admin endpoints. Same client the agent uses.
    "httpx>=0.28.1",
    # Human-friendly tables/panels for the default (non --json) output.
    "rich>=13.7",
    # Typed parsing of the API response envelopes / DTOs.
    "pydantic>=2.7",
    # CloudWatch Logs access for `pst logs`. Imported lazily inside the query
    # path so commands that never touch AWS don't pay its import cost.
    "boto3>=1.35",
]

[project.scripts]
pst = "prog_strength_tooling.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Mocks httpx at the transport layer — same approach as the agent repo.
    "respx>=0.21",
    # Formatter (owner's preference) + linter. black owns formatting; ruff is
    # lint-only here, so the two don't fight over the same files.
    "black>=24.10",
    "ruff>=0.6",
    # Local git hooks (format/lint/commit-msg/tests). See .pre-commit-config.yaml.
    "pre-commit>=3.7",
]
# Release tooling — kept out of the default dev install; only the release
# workflow needs it (`uv sync --group release`).
release = [
    "python-semantic-release>=10,<11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prog_strength_tooling"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
# black owns formatting; keep ruff to lint rules that don't conflict with it.
# (Default E/F selection is black-compatible at this line length.)

[tool.pytest.ini_options]
pythonpath = ["src"]

# Automated versioning via python-semantic-release. Conventional commits on
# main drive the version bump; PSR updates the version in both files below,
# regenerates CHANGELOG.md, tags vX.Y.Z, and cuts a GitHub release. No manual
# version edits — PSR owns [project].version.
[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/prog_strength_tooling/__init__.py:__version__"]
# Internal operator tool: no PyPI publish. The "build" step just re-locks so
# uv.lock's package version tracks the bump; `assets` makes PSR commit the
# updated lock with the release, keeping `uv sync --frozen` green on branches
# cut after a release. Plain `uv lock` (no --upgrade) only touches what must
# change — this package's own version — so dependencies don't churn.
build_command = "uv lock"
assets = ["uv.lock"]
commit_message = "chore(release): v{version} [skip ci]"
# Author the release commit as the CI bot rather than a human.
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
# Stay in 0.x until the tool is deliberately promoted: a breaking change bumps
# the minor (0.1 -> 0.2), not to 1.0.0.
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]
