name: Release

# Automated versioning with python-semantic-release. On every push to main
# (i.e. after a squash-merge), PSR inspects the Conventional Commits since the
# last vX.Y.Z tag and, if any are releasable (feat/fix/breaking), bumps the
# version in pyproject.toml + __init__.py, regenerates CHANGELOG.md, commits,
# tags, and cuts a GitHub release. Chore/docs/ci-only pushes are a no-op.
#
# Auth: the org-level RELEASE_BOT_TOKEN (a PAT) is used both to check out the
# repo (so the bump commit/tag can be pushed to main, even under branch
# protection that GITHUB_TOKEN can't bypass) and as GH_TOKEN for cutting the
# release. A PAT-authored push DOES re-trigger workflows, so the [skip ci] in
# PSR's release-commit subject (see commit_message in pyproject) is what
# prevents a release loop — it's load-bearing, not optional.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PSR needs full history + tags to determine the next version.
          fetch-depth: 0
          # Bot PAT so the release commit/tag push can bypass branch
          # protection on main. persist-credentials (default) leaves it in
          # the git config for PSR's push.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (incl. release group)
        run: uv sync --group release

      - name: Guard — never tag a release off a red main
        run: uv run pytest

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: uv run semantic-release version
